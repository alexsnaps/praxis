name: Enhancement
description: Starting point to a new feature, which might need a formal proposal
labels: ["enhancement", "triage/needs-triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What?
      description: What do you want to add?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Context
      description: Why is this needed?
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Assumptions
      description: What presuppositions is this based on?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI / Inference
        - Core / Config
        - Filter Pipeline
        - Observability
        - Protocol
        - Security / TLS
        - Traffic Management
        - Transformation
        - Other
